name: DOM Mutation Radar Engine

on:
  schedule:
    - cron: '19 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: dom-mutation-radar-compile
  cancel-in-progress: true

jobs:
  ingest-and-publish:
    name: Ingest and Publish
    runs-on: ubuntu-24.04

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Restore DuckDB Database Cache
        uses: actions/cache@v4
        with:
          path: data/dom_radar.db
          key: dom-radar-db-${{ runner.os }}-${{ github.ref_name }}
          restore-keys: |
            dom-radar-db-${{ runner.os }}-
            dom-radar-db-

      - name: Execute DOM Mutation Engine
        run: |
          if [ -f radar_engine.py ]; then
            python radar_engine.py
          else
            echo "radar_engine.py not found"
          fi

      - name: Create Pages Directory
        run: |
          mkdir -p public
          touch public/.nojekyll

      - name: Generate Fallback Dashboard
        run: |
          if [ ! -f public/index.html ]; then

            echo '<!DOCTYPE html>' > public/index.html
            echo '<html lang="en">' >> public/index.html
            echo '<head>' >> public/index.html
            echo '  <meta charset="UTF-8">' >> public/index.html
            echo '  <meta name="viewport" content="width=device-width, initial-scale=1">' >> public/index.html
            echo '  <title>DOM Mutation Radar Engine</title>' >> public/index.html
            echo '  <style>' >> public/index.html
            echo '    body{' >> public/index.html
            echo '      background:#0f172a;' >> public/index.html
            echo '      color:white;' >> public/index.html
            echo '      font-family:system-ui,sans-serif;' >> public/index.html
            echo '      margin:40px;' >> public/index.html
            echo '    }' >> public/index.html
            echo '    .card{' >> public/index.html
            echo '      max-width:900px;' >> public/index.html
            echo '      margin:auto;' >> public/index.html
            echo '      background:#111827;' >> public/index.html
            echo '      padding:24px;' >> public/index.html
            echo '      border-radius:12px;' >> public/index.html
            echo '    }' >> public/index.html
            echo '    h1{' >> public/index.html
            echo '      color:#38bdf8;' >> public/index.html
            echo '    }' >> public/index.html
            echo '  </style>' >> public/index.html
            echo '</head>' >> public/index.html
            echo '<body>' >> public/index.html
            echo '  <div class="card">' >> public/index.html
            echo '    <h1>DOM Mutation Radar Engine</h1>' >> public/index.html
            echo '    <p>DOM monitoring engine active.</p>' >> public/index.html
            echo '    <p>Selector drift ledger initialized.</p>' >> public/index.html
            echo '    <p>Generated automatically by GitHub Actions.</p>' >> public/index.html
            echo '  </div>' >> public/index.html
            echo '</body>' >> public/index.html
            echo '</html>' >> public/index.html

          fi

      - name: Validate Pages Payload
        run: |
          echo "===== PUBLIC CONTENTS ====="

          find public -type f

          test -d public
          test -f public/index.html

          if [ ! -s public/index.html ]; then
            echo "ERROR: index.html is empty"
            exit 1
          fi

      - name: Commit and Push Historical Ledger
        run: |
          git config user.name "metastream-bot[bot]"
          git config user.email "metastream-bot@users.noreply.github.com"

          [ -d data/history ] && git add data/history/ || true
          [ -d public ] && git add public/ || true

          if git diff --cached --quiet; then

            echo "No DOM selector mutations detected."

          else

            git commit -m "chore(history): record web DOM selector drift [skip ci]" || true

            git pull --rebase --autostash origin "${{ github.ref_name }}" || true

            git push origin HEAD:${{ github.ref_name }} || true

          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Verify Final Artifact
        run: |
          echo "Files to deploy:"
          find public -type f

          if [ ! -f public/index.html ]; then
            echo "Deployment artifact missing"
            exit 1
          fi

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Deployment Summary
        run: |
          echo "DOM Mutation Radar Engine deployment complete"
          echo "${{ steps.deployment.outputs.page_url }}"
