name: DOM Mutation Radar Engine

on:
  schedule:
    - cron: '19 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: dom-mutation-radar-compile
  cancel-in-progress: true

jobs:
  ingest-and-publish:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore DuckDB Database Cache
        uses: actions/cache@v4
        with:
          path: data/dom_radar.db
          key: dom-radar-db-${{ github.run_id }}
          restore-keys: |
            dom-radar-db-

      - name: Execute DOM Mutation Engine
        run: python radar_engine.py

      - name: Commit and push permanent historical ledger
        run: |
          git config user.name "metastream-bot[bot]"
          git config user.email "metastream-bot@users.noreply.github.com"
          git add data/history/

          if git diff --staged --quiet; then
            echo "No DOM selector mutations detected."
          else
            git commit -m "chore(history): record web DOM selector drift [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Ensure public directory is non-empty
        run: |
          mkdir -p public
          touch public/.nojekyll
          # Guarantee at least one visible file so tar does not skip the directory
          if [ -z "$(ls -A public | grep -v '^\.')" ]; then
            echo "DOM Mutation Radar Engine - Active ($(date -u))" > public/index.html
          fi
          ls -la public

      - name: Upload Artifacts to Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: 'public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
